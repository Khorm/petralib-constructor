plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.11' apply true
    id 'io.spring.dependency-management' version '1.1.0'
}

group = 'com.petralib'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'
targetCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

manifest {
    attributes('Main-Class': 'com.petralib.ConstructorApplication')
}

jar{
    zip64 true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    doFirst {
        manifest {
            attributes('Main-Class': 'com.petralib.ConstructorApplication',
                    'Class-Path': configurations.runtimeClasspath
                            .collect { "libs/${it.name}" }
                            .join(' ')
            )
        }
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}


repositories {
    gradlePluginPortal()
    mavenCentral()
}

ext {

    mapstructVersion = "1.5.5.Final"
    lombokVersion = "1.18.34"
    boot = "2.7.18"
}

dependencies {
// https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'

    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa', version: '3.3.11'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: '3.3.11'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-thymeleaf', version: '3.3.11'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: '3.3.11'
    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-validation
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-validation', version: '3.3.11'
    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-gradle-plugin
    implementation 'org.springframework.boot:spring-boot-gradle-plugin:3.3.11'
    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-jdbc
    implementation 'org.springframework.boot:spring-boot-starter-jdbc:3.3.11'

    // https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt
    implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.9.1'

//	// https://mvnrepository.com/artifact/org.hibernate.orm/hibernate-core
//	implementation group: 'org.hibernate.orm', name: 'hibernate-core', version: '6.2.5.Final'

    // https://mvnrepository.com/artifact/org.springframework/spring-aop
    implementation group: 'org.springframework', name: 'spring-aop', version: '6.0.10'
    implementation 'org.postgresql:postgresql:42.7.7'

//    implementation 'org.springframework.boot:spring-boot-devtools:3.5.5'
//    implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation 'org.yaml:snakeyaml:2.4'

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"

    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'


    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.6'
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"


}

tasks.named('test') {
    useJUnitPlatform()
}


tasks.register('fatJar', Jar) {
    manifest.from jar.manifest
    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

